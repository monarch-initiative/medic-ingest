name: "medic_indication"
metadata:
  ingest_title: "MeDIC Drug-to-Disease Indications"
  ingest_url: "https://doi.org/10.6084/m9.figshare.30491081"
  description: "Drug to disease indication edges from MeDIC (Medicines, Diseases, Indications, and Contraindications), tagged with the approving regulator (FDA/EMA/PMDA), verbatim indication text, and source URL where available. Disease ids normalized to MONDO via SSSOM; drug ids via the SRI Node Normalizer."
reader:
  format: "jsonl"
  files:
    - "../data/indications_by_agency.jsonl"
transform:
  code: "medic_indication.py"
writer:
  # Node ids are normalized (diseases -> MONDO via SSSOM, drugs via NodeNorm), which
  # collapses synonymous ids, so the unique-node count is lower than the raw endpoint count.
  min_node_count: 3000
  # One edge per drug-disease pair; an indication approved by multiple agencies is a
  # single edge with multiple supporting_data_source entries (see README).
  min_edge_count: 10000
  node_properties:
    - id
    - category
    - name
    - equivalent_identifiers
    - provided_by
  edge_properties:
    - id
    - subject
    - original_subject
    - predicate
    - object
    - original_object
    - category
    - knowledge_level
    - agent_type
    - primary_knowledge_source
    - sources
    - supporting_text
    - publications
