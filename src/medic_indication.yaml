name: "medic_indication"
metadata:
  ingest_title: "MeDIC Drug-to-Disease Indications"
  ingest_url: "https://doi.org/10.6084/m9.figshare.30491081"
  description: "Drug to disease indication edges from MeDIC (Medicines, Diseases, Indications, and Contraindications)"
reader:
  format: "csv"
  files:
    - "../data/indicationList.tsv"
  delimiter: "\t"
transform:
  code: "medic_indication.py"
writer:
  min_node_count: 0
  min_edge_count: 15000
  edge_properties:
    - id
    - subject
    - predicate
    - object
    - category
    - knowledge_level
    - agent_type
    - primary_knowledge_source
    - aggregator_knowledge_source
    - publications
