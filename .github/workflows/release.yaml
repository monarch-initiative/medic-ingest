name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave empty for auto-generated date tag)'
        required: false
        type: string
  schedule:
    # Run monthly on the 1st at midnight UTC
    - cron: '0 0 1 * *'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run pipeline
        run: just run

      # Supplementary QA artifact; uvx auto-fetches Python 3.13 + bmt. Don't let a
      # kgxval hiccup block the data release -- the xlsx is nice-to-have.
      - name: Generate kgxval validation summary
        continue-on-error: true
        run: just kgxval-summary

      - name: Generate release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            Automated release of MeDIC ingest data.

            ## Transforms included
            - medic_indication (Drug to disease associations from MeDIC)

            A `medic_kgxval_summary.xlsx` Biolink/KGX validation summary
            (monarch-initiative/kgxval) is included when generation succeeds.
          files: |
            output/*
